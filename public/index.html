<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D4 BRAZIL · 3D Live Eye + Joker + Anime</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050805;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      cursor: default;
    }
    canvas {
      display: block;
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* OVERLAY HACKER — tetap di atas animasi */
    .hacker-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    .hacker-overlay .grid {
      background-image:
        linear-gradient(rgba(0,255,65,0.008) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,65,0.008) 1px, transparent 1px);
      background-size: 40px 40px;
      width: 100%;
      height: 100%;
    }
    .hacker-overlay .scanline {
      background: repeating-linear-gradient(0deg,
          transparent 0px,
          transparent 2px,
          rgba(0,255,65,0.012) 2px,
          rgba(0,255,65,0.012) 4px);
      background-size: 100% 4px;
      width: 100%;
      height: 100%;
      animation: scanMove 6s linear infinite;
    }
    @keyframes scanMove {
      0% { background-position: 0 0; }
      100% { background-position: 0 100%; }
    }
    .hacker-overlay .vignette {
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
      width: 100%;
      height: 100%;
    }
    .hacker-overlay .glitch {
      background: transparent;
      animation: glitchFlick 5s infinite;
      width: 100%;
      height: 100%;
    }
    @keyframes glitchFlick {
      0%, 94%, 100% { opacity: 0; }
      95% { opacity: 0.05; background: rgba(0,255,65,0.06); transform: translateX(3px); }
      96% { opacity: 0.03; background: rgba(0,255,65,0.04); transform: translateX(-3px); }
      97% { opacity: 0.06; background: rgba(0,255,65,0.08); transform: translateX(2px); }
    }
    .hacker-overlay .noise {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      opacity: 0.5;
      width: 100%;
      height: 100%;
    }

    /* UI — minimal, transparan */
    #ui {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0,20,0,0.5);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0,255,65,0.08);
      border-radius: 60px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 92vw;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    }
    #ui input {
      background: rgba(0,20,0,0.4);
      border: 1px solid rgba(0,255,65,0.1);
      border-radius: 30px;
      padding: 8px 16px;
      color: #d0ffd0;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      width: 160px;
      outline: none;
    }
    #ui input:focus { border-color: rgba(0,255,65,0.25); }
    #ui button {
      background: rgba(0,255,65,0.04);
      border: 1px solid rgba(0,255,65,0.1);
      border-radius: 30px;
      padding: 8px 20px;
      color: #00ff41;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
    }
    #ui button:hover {
      background: rgba(0,255,65,0.06);
      border-color: rgba(0,255,65,0.2);
    }
    #ui .status {
      color: #88aa88;
      font-size: 0.7rem;
    }
    #ui .dev-link {
      color: #00ff41;
      text-decoration: none;
      font-size: 0.7rem;
      border: 1px solid rgba(0,255,65,0.06);
      padding: 6px 14px;
      border-radius: 30px;
    }
    .audio-ctrl {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .audio-ctrl button {
      background: transparent;
      border: 1px solid rgba(0,255,65,0.08);
      color: #00ff41;
      padding: 4px 12px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.7rem;
    }
    .audio-ctrl input[type="range"] {
      width: 60px;
      height: 3px;
      -webkit-appearance: none;
      background: rgba(0,255,65,0.08);
      border-radius: 2px;
      outline: none;
    }
    .audio-ctrl input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #00ff41;
      cursor: pointer;
    }
    @media (max-width: 700px) {
      #ui { padding: 10px 16px; gap: 10px; border-radius: 30px; bottom: 16px; }
      #ui input { width: 120px; font-size: 0.7rem; }
      #ui button { font-size: 0.7rem; padding: 6px 14px; }
    }
  </style>
</head>
<body>

  <!-- HACKER OVERLAY (di atas canvas, di bawah UI) -->
  <div class="hacker-overlay">
    <div class="grid"></div>
    <div class="scanline"></div>
    <div class="vignette"></div>
    <div class="glitch"></div>
    <div class="noise"></div>
  </div>

  <!-- CANVAS 3D -->
  <canvas id="canvas3d"></canvas>

  <!-- UI -->
  <div id="ui">
    <span style="color:#00ff41;font-weight:700;font-size:0.9rem;">⬡ D4</span>
    <input id="phoneInput" placeholder="812-3456-7890" value="81234567890">
    <button id="btnSend">▶ spam</button>
    <span class="status" id="status">siap</span>
    <div class="audio-ctrl">
      <button id="playBtn">▶</button>
      <input type="range" id="volumeSlider" min="0" max="100" value="25">
    </div>
    <a href="https://wa.me/6288803536269" target="_blank" class="dev-link">📱 dev</a>
  </div>

  <audio id="bgAudio" loop preload="auto">
    <source src="https://files.catbox.moe/fi2k19.mp3" type="audio/mpeg">
  </audio>

  <script>
    // ================================================================
    //  3D ANIMATION ENGINE — REALISTIC EYE + JOKER MOUTH + ANIME
    //  Semua berbentuk 3D shading, depth, perspective
    // ================================================================

    const canvas = document.getElementById('canvas3d');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // ---- TIME & STATE ----
    let time = 0;
    let blinkPhase = 0;       // 0 = terbuka, 1 = tertutup (smooth)
    let blinkTimer = 0;
    let pupilLX = 0, pupilRX = 0;
    let pupilDir = 1;

    // Anime state
    let animeWave = 0;
    let kissBlow = 0;
    let handWave = 0;

    // ---- 3D SHADING HELPER ----
    function shade(color, light) {
      // light: -1..1
      const r = parseInt(color.slice(1,2),16)*17 || 0;
      const g = parseInt(color.slice(2,3),16)*17 || 0;
      const b = parseInt(color.slice(3,4),16)*17 || 0;
      const f = 0.5 + light * 0.5;
      return `rgb(${Math.min(255,Math.floor(r*f))},${Math.min(255,Math.floor(g*f))},${Math.min(255,Math.floor(b*f))})`;
    }

    // ---- DRAW 3D EYE WITH EYELASHES ----
    function drawEye3D(cx, cy, radius, isLeft, blink) {
      const scale = 1 - blink * 0.35;
      const rx = radius * 1.0;
      const ry = radius * 0.75 * scale;

      // 1. Socket (bayangan)
      ctx.shadowBlur = 60;
      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.fillStyle = 'rgba(0,10,0,0.2)';
      ctx.beginPath();
      ctx.ellipse(cx, cy + 8, rx * 1.1, ry * 1.1, 0, 0, Math.PI*2);
      ctx.fill();

      // 2. Sklera (putih mata) — 3D shading
      const grad = ctx.createRadialGradient(
        cx - rx*0.2, cy - ry*0.3, rx*0.1,
        cx, cy, rx*0.9
      );
      grad.addColorStop(0, 'rgba(0,255,65,0.015)');
      grad.addColorStop(0.3, 'rgba(0,255,65,0.025)');
      grad.addColorStop(0.7, 'rgba(0,30,0,0.04)');
      grad.addColorStop(1, 'rgba(0,0,0,0.12)');
      ctx.shadowBlur = 40;
      ctx.shadowColor = 'rgba(0,255,65,0.04)';
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2);
      ctx.fill();

      // 3. Outline neon
      ctx.shadowBlur = 60;
      ctx.shadowColor = 'rgba(0,255,65,0.06)';
      ctx.strokeStyle = 'rgba(0,255,65,0.06)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2);
      ctx.stroke();

      // 4. Iris & pupil (3D depth)
      if (blink < 0.85) {
        const irisScale = 1 - blink * 0.4;
        const pupilOff = isLeft ? pupilLX : pupilRX;
        const px = cx + pupilOff * rx * 0.35;
        const py = cy + Math.sin(time*0.002) * 2;
        const irisR = rx * 0.28 * irisScale;
        const pupilR = rx * 0.14 * irisScale;

        // Iris gradient 3D
        const irisGrad = ctx.createRadialGradient(
          px - irisR*0.2, py - irisR*0.2, irisR*0.1,
          px, py, irisR
        );
        irisGrad.addColorStop(0, 'rgba(0,255,65,0.06)');
        irisGrad.addColorStop(0.5, 'rgba(0,20,0,0.04)');
        irisGrad.addColorStop(1, 'rgba(0,0,0,0.08)');
        ctx.shadowBlur = 50;
        ctx.shadowColor = 'rgba(0,255,65,0.08)';
        ctx.fillStyle = irisGrad;
        ctx.beginPath();
        ctx.arc(px, py, irisR, 0, Math.PI*2);
        ctx.fill();

        // Pupil
        ctx.shadowBlur = 60;
        ctx.shadowColor = 'rgba(0,255,65,0.12)';
        ctx.fillStyle = 'rgba(0,10,0,0.85)';
        ctx.beginPath();
        ctx.arc(px, py, pupilR, 0, Math.PI*2);
        ctx.fill();

        // Highlight (pantulan cahaya 3D)
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(0,255,65,0.08)';
        ctx.beginPath();
        ctx.arc(px - pupilR*0.3, py - pupilR*0.35, pupilR*0.2, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.02)';
        ctx.beginPath();
        ctx.arc(px - pupilR*0.2, py - pupilR*0.4, pupilR*0.08, 0, Math.PI*2);
        ctx.fill();
      }

      // 5. BULU MATA (3D — melengkung, berkedip)
      ctx.shadowBlur = 20;
      ctx.shadowColor = 'rgba(0,255,65,0.02)';
      const lashCount = 14;
      const lashLen = rx * 0.18;
      const blinkLash = blink * 0.5;
      for (let i = 0; i < lashCount; i++) {
        const angle = -Math.PI/2 + (i / (lashCount-1)) * Math.PI * 0.9;
        const x1 = cx + Math.cos(angle) * rx * 0.85;
        const y1 = cy + Math.sin(angle) * ry * 0.85 * (1 - blink*0.2);
        const lashAngle = angle - 0.3 + Math.sin(i*0.8) * 0.15;
        const len = lashLen * (0.7 + 0.3 * Math.sin(i*0.5 + 1));
        const x2 = x1 + Math.cos(lashAngle) * len * (1 - blinkLash*0.6);
        const y2 = y1 + Math.sin(lashAngle) * len * (1 - blinkLash*0.6) - blink * 3;
        ctx.strokeStyle = `rgba(0,255,65,${0.04 + 0.02 * (1 - blink)})`;
        ctx.lineWidth = 1 + 0.5 * (1 - blink);
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.quadraticCurveTo(
          x1 + Math.cos(lashAngle+0.2)*len*0.3,
          y1 + Math.sin(lashAngle+0.2)*len*0.3 - 3,
          x2, y2
        );
        ctx.stroke();
        // Bulu mata bawah (lebih pendek)
        const angle2 = Math.PI/2 + (i / (lashCount-1)) * Math.PI * 0.9;
        const x1b = cx + Math.cos(angle2) * rx * 0.8;
        const y1b = cy + Math.sin(angle2) * ry * 0.8 * (1 - blink*0.15);
        const lashAngle2 = angle2 + 0.3 - Math.sin(i*0.7) * 0.1;
        const len2 = lashLen * 0.5 * (0.6 + 0.4 * Math.sin(i*0.6 + 2));
        const x2b = x1b + Math.cos(lashAngle2) * len2 * (1 - blinkLash*0.4);
        const y2b = y1b + Math.sin(lashAngle2) * len2 * (1 - blinkLash*0.4) + blink * 2;
        ctx.strokeStyle = `rgba(0,255,65,0.02)`;
        ctx.lineWidth = 0.6;
        ctx.beginPath();
        ctx.moveTo(x1b, y1b);
        ctx.quadraticCurveTo(
          x1b + Math.cos(lashAngle2-0.2)*len2*0.3,
          y1b + Math.sin(lashAngle2-0.2)*len2*0.3 + 3,
          x2b, y2b
        );
        ctx.stroke();
      }

      // 6. Garis kelopak atas (3D depth)
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(0,255,65,0.02)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i < 20; i++) {
        const t = i / 19;
        const angle = -Math.PI*0.45 + t * Math.PI*0.9;
        const x = cx + Math.cos(angle) * rx * 0.95;
        const y = cy + Math.sin(angle) * ry * 0.95 * (1 - blink*0.15);
        if (i===0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    // ---- DRAW 3D JOKER MOUTH ----
    function drawJokerMouth3D(cx, cy, w) {
      const h = w * 0.28;
      const timeMouth = time * 0.025;

      // 1. Bayangan mulut
      ctx.shadowBlur = 80;
      ctx.shadowColor = 'rgba(0,0,0,0.4)';
      ctx.fillStyle = 'rgba(10,0,0,0.2)';
      ctx.beginPath();
      ctx.ellipse(cx + 2, cy + 6, w*0.45, h*0.5, 0, 0, Math.PI*2);
      ctx.fill();

      // 2. Bibir & rongga mulut (3D depth)
      const mouthOpen = 0.6 + 0.2 * Math.sin(timeMouth);
      const smileCurve = 0.15 * Math.sin(timeMouth * 0.7);

      // Rongga (hitam dalam)
      ctx.shadowBlur = 40;
      ctx.shadowColor = 'rgba(255,0,40,0.05)';
      ctx.fillStyle = 'rgba(5,0,0,0.75)';
      ctx.beginPath();
      ctx.ellipse(cx, cy + h*0.2, w*0.4, h*0.5 * mouthOpen, 0, 0, Math.PI*2);
      ctx.fill();

      // Bibir atas (3D)
      ctx.shadowBlur = 30;
      ctx.shadowColor = 'rgba(255,50,80,0.06)';
      const lipGrad = ctx.createLinearGradient(cx - w*0.3, cy - h*0.2, cx + w*0.3, cy + h*0.2);
      lipGrad.addColorStop(0, 'rgba(180,20,40,0.03)');
      lipGrad.addColorStop(0.5, 'rgba(220,40,60,0.06)');
      lipGrad.addColorStop(1, 'rgba(140,10,30,0.03)');
      ctx.fillStyle = lipGrad;
      ctx.beginPath();
      ctx.moveTo(cx - w*0.45, cy - h*0.05);
      ctx.quadraticCurveTo(cx - w*0.2, cy - h*0.3 + smileCurve*10, cx, cy - h*0.1);
      ctx.quadraticCurveTo(cx + w*0.2, cy - h*0.3 + smileCurve*10, cx + w*0.45, cy - h*0.05);
      ctx.quadraticCurveTo(cx + w*0.3, cy + h*0.1, cx, cy + h*0.1);
      ctx.quadraticCurveTo(cx - w*0.3, cy + h*0.1, cx - w*0.45, cy - h*0.05);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,60,80,0.05)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Bibir bawah
      ctx.fillStyle = 'rgba(160,20,30,0.04)';
      ctx.beginPath();
      ctx.moveTo(cx - w*0.4, cy + h*0.2);
      ctx.quadraticCurveTo(cx - w*0.15, cy + h*0.4 + smileCurve*8, cx, cy + h*0.3);
      ctx.quadraticCurveTo(cx + w*0.15, cy + h*0.4 + smileCurve*8, cx + w*0.4, cy + h*0.2);
      ctx.quadraticCurveTo(cx + w*0.25, cy + h*0.0, cx, cy + h*0.1);
      ctx.quadraticCurveTo(cx - w*0.25, cy + h*0.0, cx - w*0.4, cy + h*0.2);
      ctx.fill();

      // Gigi (3D — shading)
      ctx.shadowBlur = 10;
      ctx.shadowColor = 'rgba(0,0,0,0.1)';
      for (let i = -5; i <= 5; i++) {
        const x = cx + i * (w * 0.065);
        const yTop = cy - h*0.02 + Math.sin(i*0.6 + time*0.01)*2;
        const yBot = cy + h*0.08 + Math.sin(i*0.4 + time*0.015)*2;
        const ww = w * 0.035;
        ctx.fillStyle = `rgba(200,220,200,${0.015 + 0.01 * (1 - Math.abs(i)/6)})`;
        ctx.fillRect(x - ww/2, yTop, ww, yBot - yTop);
        ctx.strokeStyle = 'rgba(200,200,200,0.01)';
        ctx.lineWidth = 0.3;
        ctx.strokeRect(x - ww/2, yTop, ww, yBot - yTop);
      }

      // Sudut senyum Joker (melengkung ke atas)
      ctx.shadowBlur = 20;
      ctx.shadowColor = 'rgba(255,0,40,0.03)';
      ctx.strokeStyle = 'rgba(255,30,70,0.04)';
      ctx.lineWidth = 2;
      for (let side = -1; side <= 1; side+=2) {
        const sx = cx + side * w * 0.45;
        const sy = cy + h*0.05 + side * 0.1 * h;
        ctx.beginPath();
        ctx.moveTo(sx - side*5, sy);
        ctx.quadraticCurveTo(
          sx - side*20, sy - h*0.3,
          sx - side*30, sy - h*0.1
        );
        ctx.stroke();
      }

      // "HA HA HA" teks halus
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,50,80,0.015)';
      ctx.font = '12px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('HA HA HA', cx, cy + h * 1.6 + Math.sin(time*0.02)*3);
    }

    // ---- DRAW 3D ANIME BODY (sexy, proporsi 3D) ----
    function drawAnime3D() {
      const baseX = W * 0.5;
      const baseY = H * 0.62;
      const scale = Math.min(W, H) * 0.018;

      // Gerakan tubuh (seperti bernapas & goyang)
      const breath = Math.sin(time * 0.025) * 0.015;
      const sway = Math.sin(time * 0.015) * 0.02;
      const headBob = Math.sin(time * 0.02) * 0.01;

      // ---- KEPALA (3D) ----
      const headR = 38 * scale;
      const headX = baseX + sway * 30;
      const headY = baseY - 10 * scale + headBob * 30;

      // Shading kepala
      const headGrad = ctx.createRadialGradient(
        headX - headR*0.3, headY - headR*0.3, headR*0.1,
        headX, headY, headR
      );
      headGrad.addColorStop(0, 'rgba(0,255,65,0.04)');
      headGrad.addColorStop(0.6, 'rgba(0,30,0,0.02)');
      headGrad.addColorStop(1, 'rgba(0,0,0,0.02)');
      ctx.shadowBlur = 50;
      ctx.shadowColor = 'rgba(0,255,65,0.02)';
      ctx.fillStyle = headGrad;
      ctx.beginPath();
      ctx.arc(headX, headY, headR, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,255,65,0.02)';
      ctx.lineWidth = 0.5;
      ctx.stroke();

      // Rambut (3D — bentuk)
      ctx.shadowBlur = 20;
      ctx.shadowColor = 'rgba(0,255,65,0.01)';
      ctx.fillStyle = 'rgba(0,255,65,0.015)';
      for (let i = 0; i < 12; i++) {
        const angle = -Math.PI*0.6 + i/11 * Math.PI*1.2;
        const r = headR * (0.8 + 0.2 * Math.sin(i*0.7 + time*0.01));
        const x = headX + Math.cos(angle) * r * 0.9;
        const y = headY + Math.sin(angle) * r * 0.8 - headR*0.2;
        ctx.beginPath();
        ctx.ellipse(x, y, headR*0.15, headR*0.25, angle*0.3, 0, Math.PI*2);
        ctx.fill();
      }

      // Mata anime (3D big eyes)
      const eyeOff = headR * 0.25;
      const eyeR = headR * 0.08;
      for (let side = -1; side <= 1; side += 2) {
        const ex = headX + side * eyeOff + Math.sin(time*0.01 + side)*2;
        const ey = headY - headR*0.1 + Math.sin(time*0.02)*1;
        // Putih mata
        ctx.shadowBlur = 30;
        ctx.shadowColor = 'rgba(0,255,65,0.02)';
        ctx.fillStyle = 'rgba(0,20,0,0.03)';
        ctx.beginPath();
        ctx.ellipse(ex, ey, eyeR*1.2, eyeR*1.5, 0, 0, Math.PI*2);
        ctx.fill();
        // Iris
        ctx.fillStyle = 'rgba(0,255,65,0.03)';
        ctx.beginPath();
        ctx.arc(ex + side*2, ey, eyeR*0.6, 0, Math.PI*2);
        ctx.fill();
        // Pupil
        ctx.fillStyle = 'rgba(0,20,0,0.4)';
        ctx.beginPath();
        ctx.arc(ex + side*3, ey, eyeR*0.3, 0, Math.PI*2);
        ctx.fill();
        // Highlight
        ctx.fillStyle = 'rgba(255,255,255,0.02)';
        ctx.beginPath();
        ctx.arc(ex + side*2 - eyeR*0.2, ey - eyeR*0.3, eyeR*0.12, 0, Math.PI*2);
        ctx.fill();
      }

      // Mulut (kecil)
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,100,150,0.02)';
      ctx.beginPath();
      ctx.arc(headX, headY + headR*0.3, headR*0.08, 0, Math.PI);
      ctx.fill();

      // ---- BADAN (3D) ----
      const bodyW = 28 * scale;
      const bodyH = 52 * scale;
      const bodyX = headX;
      const bodyY = headY + headR * 0.7 + breath * 30;

      // Badan gradient 3D
      const bodyGrad = ctx.createLinearGradient(bodyX - bodyW, bodyY, bodyX + bodyW, bodyY + bodyH);
      bodyGrad.addColorStop(0, 'rgba(0,255,65,0.015)');
      bodyGrad.addColorStop(0.5, 'rgba(0,40,0,0.01)');
      bodyGrad.addColorStop(1, 'rgba(0,255,65,0.015)');
      ctx.shadowBlur = 40;
      ctx.shadowColor = 'rgba(0,255,65,0.01)';
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.ellipse(bodyX, bodyY + bodyH*0.4, bodyW, bodyH*0.5, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,255,65,0.015)';
      ctx.lineWidth = 0.3;
      ctx.stroke();

      // Dada (3D volume)
      ctx.shadowBlur = 20;
      ctx.fillStyle = 'rgba(0,255,65,0.015)';
      ctx.beginPath();
      ctx.ellipse(bodyX - bodyW*0.2, bodyY + bodyH*0.25, bodyW*0.3, bodyH*0.15, 0.2, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(bodyX + bodyW*0.2, bodyY + bodyH*0.25, bodyW*0.3, bodyH*0.15, -0.2, 0, Math.PI*2);
      ctx.fill();

      // ---- TANGAN (3D, bergerak aktif) ----
      const armLen = 36 * scale;
      const handWave = Math.sin(time * 0.03) * 0.4 + 0.3;

      // Tangan kanan (melambai — dadah)
      const rShoulderX = bodyX + bodyW * 0.7;
      const rShoulderY = bodyY + bodyH*0.15 + Math.sin(time*0.02)*5;
      const rElbowX = rShoulderX + Math.cos(1.2 + handWave*0.3) * armLen * 0.8;
      const rElbowY = rShoulderY - Math.sin(1.2 + handWave*0.3) * armLen * 0.8 + Math.sin(time*0.025)*8;
      const rHandX = rElbowX + Math.cos(0.8 + handWave*0.6) * armLen * 0.6;
      const rHandY = rElbowY - Math.sin(0.8 + handWave*0.6) * armLen * 0.6 - 10;

      ctx.shadowBlur = 20;
      ctx.shadowColor = 'rgba(0,255,65,0.01)';
      ctx.strokeStyle = 'rgba(0,255,65,0.02)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(rShoulderX, rShoulderY);
      ctx.quadraticCurveTo(
        rShoulderX + Math.cos(1.0+handWave*0.2)*armLen*0.5,
        rShoulderY - Math.sin(1.0+handWave*0.2)*armLen*0.5 - 10,
        rElbowX, rElbowY
      );
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(rElbowX, rElbowY);
      ctx.quadraticCurveTo(
        rElbowX + Math.cos(0.7+handWave*0.4)*armLen*0.4,
        rElbowY - Math.sin(0.7+handWave*0.4)*armLen*0.4 - 8,
        rHandX, rHandY
      );
      ctx.stroke();
      // Tangan (lingkaran)
      ctx.fillStyle = 'rgba(0,255,65,0.02)';
      ctx.beginPath();
      ctx.arc(rHandX, rHandY, 8, 0, Math.PI*2);
      ctx.fill();

      // Tangan kiri (kiss)
      const lShoulderX = bodyX - bodyW * 0.7;
      const lShoulderY = bodyY + bodyH*0.15 + Math.sin(time*0.02+1)*5;
      const lElbowX = lShoulderX - Math.cos(1.0 + Math.sin(time*0.02)*0.2) * armLen * 0.7;
      const lElbowY = lShoulderY - Math.sin(1.0 + Math.sin(time*0.02)*0.2) * armLen * 0.7 + Math.sin(time*0.025+2)*8;
      const lHandX = lElbowX - Math.cos(0.5 + Math.sin(time*0.015)*0.1) * armLen * 0.5;
      const lHandY = lElbowY - Math.sin(0.5 + Math.sin(time*0.015)*0.1) * armLen * 0.5 - 12;

      ctx.strokeStyle = 'rgba(255,100,150,0.02)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(lShoulderX, lShoulderY);
      ctx.quadraticCurveTo(
        lShoulderX - Math.cos(0.8)*armLen*0.4,
        lShoulderY - Math.sin(0.8)*armLen*0.4 - 8,
        lElbowX, lElbowY
      );
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(lElbowX, lElbowY);
      ctx.quadraticCurveTo(
        lElbowX - Math.cos(0.4)*armLen*0.3,
        lElbowY - Math.sin(0.4)*armLen*0.3 - 6,
        lHandX, lHandY
      );
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,100,150,0.02)';
      ctx.beginPath();
      ctx.arc(lHandX, lHandY, 7, 0, Math.PI*2);
      ctx.fill();

      // Efek kiss (love floating)
      if (Math.sin(time*0.02) > 0.8) {
        const loveSize = 14 + Math.sin(time*0.05)*6;
        ctx.fillStyle = `rgba(255,100,150,${0.02 + 0.01 * Math.sin(time*0.03)})`;
        ctx.font = `${loveSize}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText('❤', lHandX - 30, lHandY - 20 - Math.sin(time*0.04)*10);
      }

      // ---- KAKI (3D) ----
      ctx.strokeStyle = 'rgba(0,255,65,0.01)';
      ctx.lineWidth = 3;
      const legSwing = Math.sin(time*0.02) * 0.1;
      for (let side = -1; side <= 1; side += 2) {
        const hipX = bodyX + side * bodyW * 0.4;
        const hipY = bodyY + bodyH * 0.8;
        const kneeX = hipX + side * 12 + Math.sin(time*0.025 + side)*6;
        const kneeY = hipY + 30 + Math.sin(time*0.02 + side)*8;
        const footX = kneeX + side * 8 + Math.sin(time*0.03 + side)*4;
        const footY = kneeY + 30 + Math.cos(time*0.02 + side)*6;
        ctx.beginPath();
        ctx.moveTo(hipX, hipY);
        ctx.quadraticCurveTo(
          hipX + side*10 + Math.sin(time*0.01)*5,
          hipY + 15,
          kneeX, kneeY
        );
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(kneeX, kneeY);
        ctx.quadraticCurveTo(
          kneeX + side*5 + Math.sin(time*0.015)*4,
          kneeY + 15,
          footX, footY
        );
        ctx.stroke();
      }

      // ---- PANGGILAN TEKS "ANIME LIVE" ----
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(0,255,65,0.015)';
      ctx.font = '8px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('⬡ 3D ANIME LIVE ⬡', headX, headY - headR - 20);
    }

    // ---- MAIN LOOP ----
    function loop() {
      time++;

      // ---- UPDATE BLINK ----
      blinkTimer--;
      if (blinkTimer <= 0) {
        if (blinkPhase < 0.5) {
          blinkPhase = 1;
          blinkTimer = Math.random() * 80 + 20;
        } else {
          blinkPhase = 0;
          blinkTimer = Math.random() * 150 + 80;
        }
      }
      const blink = blinkPhase * (1 - Math.exp(-blinkTimer / 15));

      // ---- UPDATE PUPIL ----
      pupilLX += 0.003 * pupilDir;
      pupilRX += 0.003 * pupilDir;
      if (Math.abs(pupilLX) > 0.7) pupilDir *= -1;

      // ---- CLEAR CANVAS ----
      ctx.clearRect(0, 0, W, H);

      // ---- BACKGROUND 3D (depth gradient) ----
      const bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.7);
      bgGrad.addColorStop(0, '#0a1a0a');
      bgGrad.addColorStop(0.5, '#070f07');
      bgGrad.addColorStop(1, '#020502');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);

      // ---- GAMBAR 3D EYE (kiri & kanan) ----
      const eyeSize = Math.min(W, H) * 0.11;
      const eyeSpacing = eyeSize * 2.2;
      const eyeY = H * 0.24;

      drawEye3D(W/2 - eyeSpacing/2, eyeY, eyeSize, true, blink);
      drawEye3D(W/2 + eyeSpacing/2, eyeY, eyeSize, false, blink);

      // ---- GAMBAR MULUT JOKER ----
      drawJokerMouth3D(W/2, eyeY + eyeSize * 0.85, eyeSize * 1.6);

      // ---- GAMBAR ANIME 3D ----
      drawAnime3D();

      // ---- TEKS INFO (halus) ----
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(0,255,65,0.02)';
      ctx.font = '9px monospace';
      ctx.textAlign = 'left';
      ctx.fillText('⬡ 3D LIVE · EYE + JOKER + ANIME', 20, 30);
      ctx.fillText('⬡ HACKER OVERLAY AKTIF', 20, 46);

      requestAnimationFrame(loop);
    }
    loop();

    // ================================================================
    // AUDIO
    // ================================================================
    const audio = document.getElementById('bgAudio');
    const playBtn = document.getElementById('playBtn');
    const volSlider = document.getElementById('volumeSlider');

    audio.volume = volSlider.value / 100;
    audio.play().catch(() => {});

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().catch(() => {});
        playBtn.textContent = '⏸';
      } else {
        audio.pause();
        playBtn.textContent = '▶';
      }
    });
    volSlider.addEventListener('input', () => {
      audio.volume = volSlider.value / 100;
    });

    // ================================================================
    // SPAM
    // ================================================================
    const phoneInput = document.getElementById('phoneInput');
    const btnSend = document.getElementById('btnSend');
    const statusEl = document.getElementById('status');

    btnSend.addEventListener('click', () => {
      const raw = phoneInput.value.trim();
      if (!raw) { statusEl.textContent = '❌ nomor kosong'; return; }
      statusEl.textContent = '⏳ sending...';
      btnSend.disabled = true;

      fetch('/api/spam', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: raw })
      })
      .then(res => res.json())
      .then(data => {
        statusEl.textContent = data.success ? '✅ sukses' : '❌ gagal';
        btnSend.disabled = false;
      })
      .catch(err => {
        statusEl.textContent = '❌ error: ' + err.message;
        btnSend.disabled = false;
      });
    });

    console.log('🚀 D4 BRAZIL · 3D Live Eye + Joker + Anime loaded.');
    console.log('💡 Semua animasi 3D dengan shading, depth, bulu mata, dan gerakan real.');
  </script>
</body>
</html>
