<body>

  <!-- CANVAS UTAMA -->
  <canvas id="canvas"></canvas>

  <!-- UI OVERLAY -->

    </div>

    <a href="https://wa.me/6288803536269" target="_blank" class="dev-link">

  <!-- AUDIO (ganti src dengan lagu lu) -->
  <audio id="bgAudio" loop preload="auto">

  <script>
    // ================================================================
    // CANVAS ANIMASI — LIVE EYE + ANIME + MULUT JOKER
    // ================================================================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // --- STATE ---
    let blink = 0; // 0 = terbuka, 1 = tertutup (lerp)
    let blinkTimer = 0;
    let pupilOffsetX = 0;
    let pupilDirection = 1;
    let time = 0;

    // --- PARAMETER MATA ---
    const eyeWidth = () => Math.min(W * 0.35, 320);
    const eyeHeight = () => eyeWidth() * 0.55;
    const eyeSpacing = () => eyeWidth() * 1.2;

    // --- ANIME STATE ---
    let animeX = 0; // posisi horizontal (gerak)
    let animeY = 0;
    let handAngle = 0; // untuk tangan melambai
    let kissPhase = 0; // untuk gerakan kiss

    // --- LOAD GAMBAR ANIME (ganti URL dengan gambar lu) ---
    const animeImg = new Image();
    // Ganti URL ini dengan gambar anime sexy yang lu punya (catbox atau lain)
    animeImg.src = 'https://files.catbox.moe/sample_anime.png'; // ganti dengan link asli
    animeImg.onerror = () => {
      // fallback: gambar buatan sendiri
      console.warn('Gambar anime gagal dimuat, pakai default shape');
    };

    // ================================================================
    // DRAW FUNCTIONS
    // ================================================================

    function drawEye(cx, cy, w, h, blinkFactor) {
      // Sklera (putih dengan efek neon)
      const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, w * 0.6);
      grad.addColorStop(0, 'rgba(0,255,65,0.02)');
      grad.addColorStop(0.7, 'rgba(0,255,65,0.04)');
      grad.addColorStop(1, 'rgba(0,0,0,0.3)');
      ctx.fillStyle = grad;
      ctx.shadowColor = 'rgba(0,255,65,0.05)';
      ctx.shadowBlur = 30;
      ctx.beginPath();
      ctx.ellipse(cx, cy, w * 0.45, h * 0.45 * (1 - blinkFactor * 0.5), 0, 0, Math.PI * 2);
      ctx.fill();

      // Outline
      ctx.shadowBlur = 50;
      ctx.shadowColor = 'rgba(0,255,65,0.06)';
      ctx.strokeStyle = 'rgba(0,255,65,0.08)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(cx, cy, w * 0.45, h * 0.45 * (1 - blinkFactor * 0.5), 0, 0, Math.PI * 2);
      ctx.stroke();

      // Pupil (hanya jika tidak kedip penuh)
      if (blinkFactor < 0.8) {
        const pupilScale = 1 - blinkFactor * 0.6;
        const px = cx + pupilOffsetX * w * 0.3;
        const py = cy;
        const irisR = w * 0.12 * pupilScale;
        const pupilR = w * 0.06 * pupilScale;

        // Iris
        ctx.shadowBlur = 40;
        ctx.shadowColor = 'rgba(0,255,65,0.1)';
        ctx.fillStyle = 'rgba(0,255,65,0.04)';
        ctx.beginPath();
        ctx.arc(px, py, irisR, 0, Math.PI * 2);
        ctx.fill();

        // Pupil
        ctx.shadowBlur = 50;
        ctx.shadowColor = 'rgba(0,255,65,0.15)';
        ctx.fillStyle = 'rgba(0,20,0,0.8)';
        ctx.beginPath();
        ctx.arc(px, py, pupilR, 0, Math.PI * 2);
        ctx.fill();

        // Pantulan
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(0,255,65,0.12)';
        ctx.beginPath();
        ctx.arc(px - pupilR * 0.3, py - pupilR * 0.3, pupilR * 0.25, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawJokerMouth(cx, cy, w) {
      const smileW = w * 0.5;
      const smileH = w * 0.2;
      ctx.shadowBlur = 30;
      ctx.shadowColor = 'rgba(255,0,0,0.08)';

      // Senyum lebar
      ctx.beginPath();
      ctx.ellipse(cx, cy + smileH * 0.2, smileW, smileH, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(20,0,0,0.7)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,0,40,0.15)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Gigi (garis-garis)
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 1;
      for (let i = -6; i <= 6; i++) {
        const x = cx + i * (smileW / 7);
        const y = cy + smileH * 0.1;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y + smileH * 0.5);
        ctx.stroke();
      }

      // Sudut senyum (seperti joker)
      ctx.strokeStyle = 'rgba(255,0,40,0.1)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx - smileW * 0.8, cy + smileH * 0.1);
      ctx.quadraticCurveTo(cx - smileW * 0.4, cy - smileH * 0.3, cx, cy + smileH * 0.1);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx + smileW * 0.8, cy + smileH * 0.1);
      ctx.quadraticCurveTo(cx + smileW * 0.4, cy - smileH * 0.3, cx, cy + smileH * 0.1);
      ctx.stroke();

      // Text "HAHA" kecil
      ctx.fillStyle = 'rgba(255,0,40,0.03)';
      ctx.font = '14px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('HAHA', cx, cy + smileH * 1.8);
    }

    function drawAnime() {
      const baseX = W * 0.5 + animeX * 20;
      const baseY = H * 0.55 + animeY * 15;

      // Jika gambar berhasil dimuat, tampilkan gambar
      if (animeImg.complete && animeImg.naturalWidth > 0) {
        const imgW = Math.min(W * 0.35, 280);
        const imgH = imgW * (animeImg.height / animeImg.width);
        const dx = baseX - imgW / 2;
        const dy = baseY - imgH / 2;

        // Simulasi goyangan tubuh
        const sway = Math.sin(time * 0.02) * 6;
        const swayY = Math.sin(time * 0.015) * 3;
        ctx.save();
        ctx.translate(baseX + sway * 0.5, baseY + swayY * 0.3);
        ctx.rotate(Math.sin(time * 0.01) * 0.03);
        ctx.shadowColor = 'rgba(0,255,65,0.04)';
        ctx.shadowBlur = 40;
        ctx.drawImage(animeImg, -imgW / 2, -imgH / 2, imgW, imgH);
        ctx.restore();

        // Animasi tangan (dadah) dan kiss
        // Kita gambar overlay tangan tambahan di atas gambar
        const handX = baseX + imgW * 0.4;
        const handY = baseY - imgH * 0.2;
        const handLen = 60;
        const handAngleNow = handAngle + Math.sin(time * 0.04) * 0.3;

        // Tangan kanan (dadah)
        ctx.save();
        ctx.translate(handX, handY);
        ctx.rotate(handAngleNow);
        ctx.shadowBlur = 20;
        ctx.shadowColor = 'rgba(0,255,65,0.05)';
        ctx.strokeStyle = 'rgba(0,255,65,0.08)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(handLen, -handLen * 0.3);
        ctx.stroke();
        // Jari (lingkaran kecil)
        ctx.fillStyle = 'rgba(0,255,65,0.04)';
        ctx.beginPath();
        ctx.arc(handLen, -handLen * 0.3, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Tangan kiri (kiss - mendekati mulut)
        const kissX = baseX - imgW * 0.3;
        const kissY = baseY - imgH * 0.1 + Math.sin(time * 0.025) * 8;
        ctx.save();
        ctx.translate(kissX, kissY);
        ctx.rotate(-0.5 + Math.sin(time * 0.02) * 0.1);
        ctx.strokeStyle = 'rgba(255,100,150,0.06)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-40, -30);
        ctx.stroke();
        // Bibir kiss (lingkaran kecil)
        ctx.fillStyle = 'rgba(255,100,150,0.05)';
        ctx.beginPath();
        ctx.arc(-40, -30, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Efek "kiss" (love)
        if (kissPhase > 0) {
          const loveSize = 20 + kissPhase * 10;
          ctx.fillStyle = `rgba(255,100,150,${0.05 * kissPhase})`;
          ctx.font = `${loveSize}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText('❤', baseX - imgW * 0.4, baseY - imgH * 0.3 - kissPhase * 20);
        }

      } else {
        // Fallback: gambar anime sederhana (chibi)
        ctx.shadowBlur = 30;
        ctx.shadowColor = 'rgba(0,255,65,0.03)';
        // Kepala (lingkaran)
        const headR = Math.min(W, H) * 0.08;
        ctx.fillStyle = 'rgba(0,255,65,0.02)';
        ctx.beginPath();
        ctx.arc(baseX, baseY - headR * 0.8, headR, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,255,65,0.04)';
        ctx.lineWidth = 1;
        ctx.stroke();
        // Badan
        ctx.fillStyle = 'rgba(0,255,65,0.01)';
        ctx.fillRect(baseX - headR * 0.5, baseY - headR * 0.2, headR, headR * 1.2);
        // Tangan
        ctx.strokeStyle = 'rgba(0,255,65,0.03)';
        ctx.lineWidth = 2;
        const armAngle = Math.sin(time * 0.03) * 0.3;
        ctx.beginPath();
        ctx.moveTo(baseX - headR * 0.5, baseY - headR * 0.1);
        ctx.lineTo(baseX - headR * 1.2, baseY + headR * 0.2 + Math.sin(time * 0.02) * 10);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(baseX + headR * 0.5, baseY - headR * 0.1);
        ctx.lineTo(baseX + headR * 1.2, baseY + headR * 0.2 + Math.cos(time * 0.025) * 10);
        ctx.stroke();
        // Mata anime (sederhana)
        ctx.fillStyle = 'rgba(0,255,65,0.03)';
        ctx.beginPath();
        ctx.arc(baseX - headR * 0.3, baseY - headR * 0.8, headR * 0.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(baseX + headR * 0.3, baseY - headR * 0.8, headR * 0.1, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // ================================================================
    // MAIN LOOP
    // ================================================================
    function draw() {
      time++;
      // Update pupil
      pupilOffsetX += 0.004 * pupilDirection;
      if (pupilOffsetX > 0.6 || pupilOffsetX < -0.6) pupilDirection *= -1;

      // Blink random
      blinkTimer--;
      if (blinkTimer <= 0) {
        if (blink < 0.5) {
          blink = 1;
          blinkTimer = Math.random() * 120 + 20;
        } else {
          blink = 0;
          blinkTimer = Math.random() * 200 + 100;
        }
      }
      const blinkFactor = blink * (1 - Math.exp(-blinkTimer / 20));

      // Kiss phase
      kissPhase = Math.max(0, kissPhase - 0.002);
      if (Math.random() < 0.001) kissPhase = 1;

      // Bersihkan canvas
      ctx.clearRect(0, 0, W, H);

      // Latar belakang gelap dengan gradien
      const bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.6);
      bg.addColorStop(0, '#0a1a0a');
      bg.addColorStop(1, '#050a05');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // --- GAMBAR MATA (kiri dan kanan) ---
      const ew = eyeWidth();
      const eh = eyeHeight();
      const spacing = eyeSpacing();
      const cx1 = W/2 - spacing/2;
      const cx2 = W/2 + spacing/2;
      const cy = H * 0.25;

      drawEye(cx1, cy, ew, eh, blinkFactor);
      drawEye(cx2, cy, ew, eh, blinkFactor);

      // --- GAMBAR MULUT JOKER ---
      drawJokerMouth(W/2, cy + eh * 0.7, ew);

      // --- GAMBAR ANIME ---
      drawAnime();

      // Text info
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(0,255,65,0.03)';
      ctx.font = '10px monospace';
      ctx.textAlign = 'left';
      ctx.fillText('⬡ live eye · anime · joker', 20, 30);

      requestAnimationFrame(draw);
    }
    draw();

    // ================================================================
    // AUDIO CONTROLS
    // ================================================================
    const audio = document.getElementById('bgAudio');
    const playBtn = document.getElementById('playBtn');
    const volumeSlider = document.getElementById('volumeSlider');

    audio.volume = volumeSlider.value / 100;
    audio.play().catch(() => {});

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().catch(() => {});
        playBtn.textContent = '⏸ pause';
      } else {
        audio.pause();
        playBtn.textContent = '▶ play';
      }
    });
    volumeSlider.addEventListener('input', () => {
      audio.volume = volumeSlider.value / 100;
    });

    // ================================================================
    // SPAM LOGIC (minimal, real API call)
    // ================================================================
    const phoneInput = document.getElementById('phoneInput');
    const btnSend = document.getElementById('btnSend');
    const statusEl = document.getElementById('status');

    btnSend.addEventListener('click', () => {
      const raw = phoneInput.value.trim();
      if (!raw) { statusEl.textContent = '❌ masukkan nomor'; return; }
      statusEl.textContent = '⏳ mengirim...';
      btnSend.disabled = true;

      fetch('/api/spam', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: raw })
      })
      .then(res => res.json())
      .then(data => {
        statusEl.textContent = '✅ selesai! ' + (data.success ? 'sukses' : 'gagal');
        btnSend.disabled = false;
      })
      .catch(err => {
        statusEl.textContent = '❌ error: ' + err.message;
        btnSend.disabled = false;
      });
    });

    console.log('🚀 D4 BRAZIL · Live Eye + Anime loaded.');
    console.log('💡 Ganti gambar anime dengan mengubah animeImg.src');
    console.log('💡 Ganti lagu dengan mengubah src di <audio>');
  </script>
