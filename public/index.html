<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Blaster · 39 Endpoints</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0b0e1a;
      color: #e8edf5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      max-width: 720px;
      width: 100%;
      background: #131d2b;
      border-radius: 20px;
      padding: 28px 24px;
      border: 1px solid #1f314a;
      box-shadow: 0 12px 48px rgba(0,0,0,0.6);
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    h1 small {
      font-size: 14px;
      font-weight: 400;
      color: #8899b4;
      background: #1a2a3f;
      padding: 2px 14px;
      border-radius: 30px;
    }
    .sub {
      color: #8899b4;
      font-size: 14px;
      margin-bottom: 24px;
      border-left: 3px solid #4f8cff;
      padding-left: 14px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #b0c4de;
      margin-bottom: 4px;
    }
    .input-row {
      display: flex;
      gap: 10px;
    }
    .input-row input {
      flex: 1;
      padding: 12px 16px;
      background: #0a111c;
      border: 1px solid #1f314a;
      border-radius: 10px;
      color: #e8edf5;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }
    .input-row input:focus {
      border-color: #4f8cff;
      box-shadow: 0 0 0 3px rgba(79,140,255,0.15);
    }
    .btn {
      padding: 12px 28px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-primary {
      background: #4f8cff;
      color: #fff;
    }
    .btn-primary:hover { background: #3a75e6; transform: scale(1.02); }
    .btn-primary:disabled { opacity: 0.4; pointer-events: none; }
    .btn-danger {
      background: #e74c3c;
      color: #fff;
    }
    .btn-danger:hover { background: #c0392b; }
    .btn-danger:disabled { opacity: 0.4; pointer-events: none; }
    .btn-success {
      background: #2ecc71;
      color: #0b0e1a;
    }
    .btn-success:hover { background: #27ae60; }
    .btn-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 20px 0 16px;
    }
    .stat-item {
      background: #0a111c;
      border-radius: 10px;
      padding: 14px 8px;
      text-align: center;
      border: 1px solid #1f314a;
    }
    .stat-item .num {
      font-size: 24px;
      font-weight: 700;
      color: #f0f4ff;
    }
    .stat-item .label {
      font-size: 11px;
      color: #8899b4;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }
    .stat-item .num.green { color: #2ecc71; }
    .stat-item .num.red { color: #e74c3c; }
    .stat-item .num.blue { color: #4f8cff; }
    .stat-item .num.gold { color: #f1c40f; }

    .progress {
      height: 6px;
      background: #1a2a3f;
      border-radius: 3px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .progress .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2ecc71, #4f8cff);
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    .log-area {
      background: #0a111c;
      border: 1px solid #1f314a;
      border-radius: 10px;
      padding: 12px;
      max-height: 340px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.6;
    }
    .log-area .entry {
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .log-area .entry .time {
      color: #4f5d85;
      margin-right: 12px;
    }
    .log-area .entry .success { color: #2ecc71; }
    .log-area .entry .failed { color: #e74c3c; }
    .log-area .entry .info { color: #60a5fa; }
    .log-area .entry .waiting { color: #f1c40f; }

    .timer {
      text-align: center;
      color: #8899b4;
      font-size: 14px;
      margin-top: 12px;
    }

    .status-msg {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(79,140,255,0.08);
      border: 1px solid rgba(79,140,255,0.15);
      color: #b0c4de;
      font-size: 14px;
      display: none;
    }
    .status-msg.show { display: block; }

    @media (max-width: 600px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .input-row { flex-direction: column; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>📱 OTP Blaster <small>39 endpoints</small></h1>
  <div class="sub">Unlimited loop &bull; 60s delay &bull; real-time</div>

  <div class="form-group">
    <label>Nomor Tujuan (contoh: 81234567890)</label>
    <div class="input-row">
      <input type="tel" id="phoneInput" placeholder="812-3456-7890" value="81234567890">
      <button class="btn btn-primary" id="startBtn">🚀 Kirim</button>
      <button class="btn btn-danger" id="stopBtn" disabled>⏹ Stop</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-item"><div class="num green" id="successCount">0</div><div class="label">Sukses</div></div>
    <div class="stat-item"><div class="num red" id="failedCount">0</div><div class="label">Gagal</div></div>
    <div class="stat-item"><div class="num blue" id="totalCount">0</div><div class="label">Total</div></div>
    <div class="stat-item"><div class="num gold" id="cycleCount">0</div><div class="label">Siklus</div></div>
  </div>

  <div class="progress"><div class="bar" id="progressBar"></div></div>

  <div class="log-area" id="logArea"></div>

  <div class="timer" id="timerDisplay">⏱️ 0.0s</div>
  <div class="status-msg" id="statusMsg"></div>
</div>

<script>
  // ============================================================
  // DOM REFS
  // ============================================================
  const phoneInput = document.getElementById('phoneInput');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const successCount = document.getElementById('successCount');
  const failedCount = document.getElementById('failedCount');
  const totalCount = document.getElementById('totalCount');
  const cycleCount = document.getElementById('cycleCount');
  const progressBar = document.getElementById('progressBar');
  const logArea = document.getElementById('logArea');
  const timerDisplay = document.getElementById('timerDisplay');
  const statusMsg = document.getElementById('statusMsg');

  // ============================================================
  // STATE
  // ============================================================
  let isRunning = false;
  let currentSessionId = null;
  let startTime = null;
  let timerInterval = null;
  let totalEndpoints = 0;
  let processedCount = 0;
  let successTotal = 0;
  let failedTotal = 0;
  let cycleCountNum = 0;

  // ============================================================
  // HELPER FUNCTIONS
  // ============================================================
  function addLog(message, type = 'info') {
    const time = new Date().toLocaleTimeString('id-ID');
    const entry = document.createElement('div');
    entry.className = 'entry';
    entry.innerHTML = `<span class="time">[${time}]</span><span class="${type}">${message}</span>`;
    logArea.appendChild(entry);
    logArea.scrollTop = logArea.scrollHeight;
  }

  function updateTimer() {
    if (!startTime) return;
    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    timerDisplay.textContent = `⏱️ ${elapsed}s`;
  }

  function showStatus(msg, isError = false) {
    statusMsg.textContent = msg;
    statusMsg.style.borderColor = isError ? '#e74c3c' : 'rgba(79,140,255,0.15)';
    statusMsg.style.background = isError ? 'rgba(231,76,60,0.08)' : 'rgba(79,140,255,0.08)';
    statusMsg.classList.add('show');
  }

  function hideStatus() {
    statusMsg.classList.remove('show');
  }

  function resetUI() {
    successCount.textContent = '0';
    failedCount.textContent = '0';
    totalCount.textContent = '0';
    cycleCount.textContent = '0';
    progressBar.style.width = '0%';
    logArea.innerHTML = '';
    timerDisplay.textContent = '⏱️ 0.0s';
    hideStatus();
  }

  // ============================================================
  // HANDLE SSE EVENTS
  // ============================================================
  function handleEvent(data) {
    switch (data.type) {
      case 'protected':
        // Tampilkan modal key (opsional, kita simpel)
        showStatus('🔐 Nomor dilindungi. Masukkan key di console atau reload.', true);
        addLog('🔐 Protected number — butuh key.', 'info');
        break;

      case 'blacklisted':
        showStatus('🛡️ Nomor ini diblacklist!', true);
        addLog('🛡️ Blacklisted: ' + data.message, 'info');
        stopSpam();
        break;

      case 'session':
        currentSessionId = data.sessionId;
        addLog(`📡 Session ID: ${currentSessionId}`, 'info');
        break;

      case 'start':
        addLog(`🚀 Spam dimulai ke ${data.phone}`, 'info');
        startBtn.disabled = true;
        stopBtn.disabled = false;
        isRunning = true;
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 100);
        hideStatus();
        break;

      case 'total':
        totalEndpoints = data.count;
        totalCount.textContent = totalEndpoints;
        addLog(`📦 Total endpoints: ${totalEndpoints}`, 'info');
        break;

      case 'sending':
        addLog(`📤 [#${data.idx}] ${data.name} (siklus ${data.cycle})`, 'info');
        break;

      case 'result':
        processedCount++;
        if (data.success) {
          successTotal++;
          addLog(`✅ [#${data.idx}] ${data.name} — OK`, 'success');
        } else {
          failedTotal++;
          addLog(`❌ [#${data.idx}] ${data.name} — FAIL`, 'failed');
        }
        successCount.textContent = successTotal;
        failedCount.textContent = failedTotal;
        totalCount.textContent = successTotal + failedTotal;
        const progress = (processedCount / totalEndpoints) * 100;
        progressBar.style.width = Math.min(progress, 100) + '%';
        break;

      case 'cycle_start':
        cycleCountNum = data.cycle;
        cycleCount.textContent = cycleCountNum;
        addLog(`🔄 Siklus #${cycleCountNum} dimulai`, 'info');
        processedCount = 0;
        progressBar.style.width = '0%';
        break;

      case 'cycle_done':
        addLog(`✅ Siklus #${cycleCountNum} selesai — ${data.totalSuccess} sukses, ${data.totalFailed} gagal (${data.elapsed})`, 'success');
        // Reset progress bar untuk siklus berikutnya
        break;

      case 'waiting':
        const delaySec = data.delay / 1000;
        addLog(`⏳ Menunggu ${delaySec} detik sebelum siklus berikutnya...`, 'waiting');
        showStatus(`⏳ Menunggu ${delaySec} detik...`);
        break;

      case 'stopped':
        addLog(`⏹️ ${data.message}`, 'info');
        showStatus('⏹️ Spam dihentikan.');
        stopSpam();
        break;

      case 'done':
        addLog(`🏁 Selesai! Total: ${data.totalSent} terkirim dalam ${data.elapsed}`, 'success');
        stopSpam();
        break;

      case 'error':
        addLog(`❌ Error: ${data.message}`, 'failed');
        showStatus(`❌ Error: ${data.message}`, true);
        stopSpam();
        break;

      default:
        // Ignore unknown events
        break;
    }
  }

  // ============================================================
  // STOP SPAM
  // ============================================================
  function stopSpam() {
    isRunning = false;
    clearInterval(timerInterval);
    startBtn.disabled = false;
    stopBtn.disabled = true;
    updateTimer();

    // Kirim stop ke server jika session aktif
    if (currentSessionId) {
      fetch(`/api/stop/${currentSessionId}`, { method: 'POST' })
        .then(() => {})
        .catch(() => {});
      currentSessionId = null;
    }
  }

  // ============================================================
  // START SPAM
  // ============================================================
  function startSpam() {
    if (isRunning) return;

    const raw = phoneInput.value.trim();
    if (!raw) {
      alert('Masukkan nomor telepon!');
      return;
    }

    // Reset UI
    resetUI();
    successTotal = 0;
    failedTotal = 0;
    processedCount = 0;
    cycleCountNum = 0;
    totalEndpoints = 0;

    // Siapkan body
    const body = { phone: raw };

    // Kirim request ke /api/spam
    fetch('/api/spam', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    })
    .then(response => {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      function processStream() {
        reader.read().then(({ done, value }) => {
          if (done) {
            // Jika stream berakhir tanpa error
            if (isRunning) stopSpam();
            return;
          }
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              try {
                const data = JSON.parse(line.slice(6));
                handleEvent(data);
              } catch (e) {
                // Ignore malformed JSON
              }
            }
          }
          processStream();
        });
      }
      processStream();
    })
    .catch(err => {
      addLog(`🔥 Error: ${err.message}`, 'failed');
      stopSpam();
    });
  }

  // ============================================================
  // EVENT BINDING
  // ============================================================
  startBtn.addEventListener('click', startSpam);
  stopBtn.addEventListener('click', stopSpam);
  phoneInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') startSpam();
  });

  // ============================================================
  // INIT
  // ============================================================
  addLog('🚀 OTP Blaster siap. 39 endpoint, loop 60 detik.', 'info');
  addLog('💡 Masukkan nomor dan klik Kirim.', 'info');
</script>
</body>
</html>
